<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CafeDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#10231c;--muted:#5d7168;--acc:#0d5c48;--accink:#fff;--hi:#f2a516;--line:#d5e0da;--l2:#aebfb6;--soft:#e1ece6;--ok:#1c7a4f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1713;--card:#16241e;--ink:#e6f0eb;--muted:#94aa9f;--acc:#4fc29b;--accink:#08140f;--hi:#f4b83f;--line:#27382f;--l2:#40584b;--soft:#1f3128;--ok:#6cd39b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1713;--card:#16241e;--ink:#e6f0eb;--muted:#94aa9f;--acc:#4fc29b;--accink:#08140f;--hi:#f4b83f;--line:#27382f;--l2:#40584b;--soft:#1f3128;--ok:#6cd39b;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
h2{font-size:19px;font-weight:600;margin:20px 0 4px}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 0}
p{margin:6px 0}
#app{max-width:480px;margin:0 auto;padding:0 16px 150px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 4px}
.tag{font-size:12px;background:var(--soft);color:var(--muted);padding:3px 10px;border-radius:99px}
.m{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.li{padding:12px 0;border-bottom:1px solid var(--line)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sec.ok{border-color:var(--ok)}
.gr{color:var(--ok);font-weight:600}
button{font:inherit;cursor:pointer}
a.btn{display:block;text-align:center;text-decoration:none}
.btn{background:var(--acc);color:var(--accink);border:2px solid var(--acc);border-radius:99px;padding:9px 18px;font-weight:600;min-height:44px}
.btn.o{background:transparent;color:var(--acc)}
.btn.hi{background:var(--hi);border-color:var(--hi);color:#10231c}
.btn.w{width:100%;margin-top:12px;padding:12px}
.btn:disabled{opacity:.45;cursor:default}
.st{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;line-height:1}
.qn{min-width:18px;text-align:center}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--l2);border-radius:10px;background:var(--card);color:var(--ink)}
.sec input{margin-top:8px}
.tb{width:auto;padding:8px 10px}
.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.dots{display:flex;gap:7px}
.d{width:32px;height:32px;border-radius:50%;border:2px dashed var(--l2);display:grid;place-items:center;font-size:15px;font-style:normal}
.d.f{background:var(--hi);border:2px solid var(--hi)}
.d.g{border-color:var(--hi)}
.cap{justify-content:space-between;margin-top:10px}
.tkt{background:var(--card);border:2px solid var(--hi);border-radius:18px;padding:22px 16px;text-align:center;margin:12px 0}
.em{font-size:42px;line-height:1}
.code{font:700 28px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;border:2px dashed var(--hi);border-radius:12px;padding:16px 8px;margin:14px 0}
.c{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.stats>div{padding:14px 10px;border-left:1px solid var(--line)}
.stats>div:first-child{border:0}
.num{font-size:26px;font-weight:800;line-height:1.1;display:block}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.it{margin:12px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:96px;background:none;border:0;padding:8px 2px 9px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:12px 20px;font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(124px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;display:none;text-align:center}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<div id="app"><header><h1>CafeDesk</h1><span class="tag">Sample data</span></header><main id="v"></main></div>
<nav>
<button data-t="0"><span>🍽️</span>Order</button>
<button data-t="1"><span>☕</span>Stamps</button>
<button data-t="2"><span>🎁</span>Reward</button>
<button data-t="3"><span>💬</span>Come back</button>
<button data-t="4"><span>📊</span>Dashboard</button>
</nav>
<div id="toast" role="status"></div>
<script>
const CAFE="Brew House",REVIEW_URL="https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID",KEY="cafedesk-v1";
const MENU=[["Masala Chai",60],["Filter Coffee",80],["Cappuccino",140],["Cold Coffee",150],["Cafe Latte",150],["Veg Sandwich",120],["Paneer Puff",70],["Maggi",90],["Brownie",110],["Samosa",40]];
const seed=()=>({
 cust:[["Aarav Mehta","9820011122",9,2,3,1],["Priya Nair","9845022233",6,5,4,2],["Rohan Gupta","9811033344",1,30,1,3],["Sneha Iyer","9901044455",4,8,2,0],["Karan Singh","9871055566",3,26,0,4],["Meera Joshi","9900066677",2,41,1,0],["Vikram Rao","9886077788",7,1,0,1],["Ananya Das","9833088899",1,22,1,5],["Divya Menon","9810099900",1,3,1,4],["Imran Khan","9823012345",5,12,2,2]].map(([n,p,v,d,s,f])=>({n,p,v,d,s,f})),
 orders:[[1,2],[0,5],[3],[2,6],[0,0,7],[4,8],[1],[9,0],[5,2],[0,3],[6,1],[7,0]].map((i,k)=>({t:k%8+1,i,a:i.reduce((s,x)=>s+MENU[x][1],0)})),
 sent:24,back:9,tab:0,act:1,cart:{},ph:"",nm:"",tb:4,done:""
});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||seed();
const m=/^#t(\d{1,2})$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=12)S.tb=+m[1];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),R=n=>"₹"+n.toLocaleString("en-IN"),PH=p=>"+91 "+p.slice(0,5)+" "+p.slice(5);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first=c=>c.n.split(" ")[0];
const msg=c=>`Hi ${first(c)}! ☕ It’s been a while since your last visit to ${CAFE}. Come back this week and enjoy 15% off your next order. Just show this message at the counter.`;
const dots=s=>`<div class="dots">${[0,1,2,3].map(i=>`<i class="d${i<s?" f":""}">${i<s?"☕":""}</i>`).join("")}<i class="d g${s>=4?" f":""}">🎁</i></div>`;
const seen=c=>{c.d=0;if(c.o){S.back++;c.o=0}};
let tt;const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",2800)};

const v0=()=>{
 const q=S.cart,n=Object.values(q).reduce((a,b)=>a+b,0),t=Object.entries(q).reduce((a,[k,v])=>a+MENU[k][1]*v,0);
 const row=i=>{const c=q[i]||0,id=`data-i="${i}"`;return `<div class="li row"><div class="sp"><b>${MENU[i][0]}</b><div class="m">${R(MENU[i][1])}</div></div>${c?`<div class="row"><button class="st" data-a="m" ${id} aria-label="Remove one">−</button><b class="qn">${c}</b><button class="st" data-a="p" ${id} aria-label="Add one">+</button></div>`:`<button class="btn o" data-a="p" ${id}>Add</button>`}</div>`};
 return `${S.done?`<div class="sec ok">${S.done}</div>`:""}
 <div class="row"><h2 class="sp">Menu</h2><select id="tb" class="tb" aria-label="Table">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${S.tb==i+1?" selected":""}>Table ${i+1}</option>`).join("")}</select></div>
 <h3>Drinks</h3>${[0,1,2,3,4].map(row).join("")}
 <h3>Snacks</h3>${[5,6,7,8,9].map(row).join("")}
 <h2 id="cart">Your order</h2>
 <div class="sec">${n?Object.entries(q).map(([k,v])=>`<div class="row"><span class="sp">${v} × ${MENU[k][0]}</span><span>${R(MENU[k][1]*v)}</span></div>`).join("")+`<div class="row tot"><b class="sp">Total</b><b>${R(t)}</b></div>`:`<div class="m">Your order is empty. Tap Add on any item.</div>`}
 <input id="nm" placeholder="Your name (optional)" autocomplete="name" value="${E(S.nm)}">
 <input id="ph" type="tel" inputmode="tel" placeholder="Mobile number, 10 digits" autocomplete="tel" value="${E(S.ph)}">
 <p class="m">We use your number for your stamp card and WhatsApp offers.</p>
 <button class="btn w" data-a="place"${n?"":" disabled"}>Place order${n?`, ${R(t)}`:""}</button></div>
 ${n?`<button class="pill" data-a="cart">🛒 ${n} item${n>1?"s":""}, ${R(t)}. View order</button>`:""}`};

const v1=()=>`<h2>Stamp card</h2><p class="m">Every coffee gets a stamp. After 4 stamps, the 5th coffee is free.</p>`+S.cust.map((c,i)=>`<div class="li"><div class="row"><div class="sp"><b>${E(c.n)}</b><div class="m">${PH(c.p)}</div></div><button class="btn hi" data-a="st" data-i="${i}">${c.s>=4?"Redeem free coffee":"Add stamp"}</button></div><div class="row cap">${dots(c.s)}<span class="m">${c.s>=4?"Free coffee unlocked":`${4-c.s} to go`}</span></div></div>`).join("");

const v2=()=>{const c=S.cust[S.act]||S.cust[0],u=c.s>=4,k=4-c.s;
 return `<h2>Reward</h2>
 <select id="rc" aria-label="Customer">${S.cust.map((x,i)=>`<option value="${i}"${i==S.act?" selected":""}>${E(x.n)}</option>`).join("")}</select>
 <div class="tkt">${u?`<div class="em">🎁</div><h2>Your 5th coffee is free!</h2><div class="code">FREE-${c.p.slice(-4)}</div><div class="m">Show this code to our staff to claim your coffee.</div>`:`<div class="em">☕</div><h2>${k} more ${k>1?"coffees":"coffee"} to unlock your free coffee</h2><div class="row" style="justify-content:center;margin:12px 0">${dots(c.s)}</div><div class="m">Your reward code appears here after 4 stamps.</div>`}</div>
 <div class="sec c"><b>Enjoyed your visit?</b><p class="m">A quick Google review helps a small cafe a lot.</p><a class="btn w" href="${REVIEW_URL}" target="_blank" rel="noopener">⭐ Write a Google review</a></div>`};

const v3=()=>{const L=S.cust.filter(c=>c.d>=21).sort((a,b)=>b.d-a.d),P=L.filter(c=>!c.o).length;
 return `<h2>Come back list</h2><p class="m">Customers we haven’t seen for 21 days or more.</p>
 <div class="sec"><div class="m">Offer message</div>${E(msg({n:"{name}"}))}</div>
 <button class="btn hi w" data-a="send"${P?"":" disabled"}>${P?`Send WhatsApp offer to all (${P})`:L.length?"Offer sent to everyone ✓":"No one to message"}</button>
 <p class="m">Demo mode: this button records the offers as sent. Bulk sending needs the WhatsApp Business API, so for now use the WhatsApp link on each row.</p>
 ${L.map(c=>`<div class="li row"><div class="sp"><b>${E(c.n)}</b><div class="m">${c.d} days away, usually orders ${MENU[c.f][0]}</div></div>${c.o?`<span class="gr">Sent ✓</span>`:""}<a class="btn o" href="https://wa.me/91${c.p}?text=${encodeURIComponent(msg(c))}" target="_blank" rel="noopener">WhatsApp</a></div>`).join("")}`};

const v4=()=>{const C=S.cust,rep=Math.round(100*C.filter(c=>c.v>=2).length/C.length),sales=S.orders.reduce((a,o)=>a+o.a,0),tl={};
 S.orders.forEach(o=>o.i.forEach(x=>tl[x]=(tl[x]||0)+1));
 const top=Object.entries(tl).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1,rate=S.sent?Math.round(100*S.back/S.sent):0;
 return `<h2>Today at the cafe</h2>
 <div class="sec stats"><div><span class="num">${rep}%</span><span class="m">Repeat customers</span></div><div><span class="num">${S.orders.length}</span><span class="m">Orders today</span></div><div><span class="num">${R(sales)}</span><span class="m">Sales today</span></div></div>
 <h2>Top items</h2><div class="sec">${top.map(([k,v])=>`<div class="it"><div class="row"><span class="sp">${MENU[k][0]}</span><b>${v} sold</b></div><div class="bar"><i style="width:${100*v/mx}%"></i></div></div>`).join("")}</div>
 <h2>Offers: sent vs came back</h2>
 <div class="sec"><div class="stats" style="margin:-14px -14px 4px"><div><span class="num">${S.sent}</span><span class="m">Offers sent</span></div><div><span class="num">${S.back}</span><span class="m">Came back</span></div><div><span class="num">${rate}%</span><span class="m">Return rate</span></div></div><div class="bar"><i style="width:${rate}%"></i></div><p class="m">Came back means they ordered or got a stamp after receiving an offer.</p></div>
 <button class="btn o w" data-a="reset">Reset sample data</button>`};
const V=[v0,v1,v2,v3,v4];

function place(){
 const items=[];for(const k in S.cart)for(let j=0;j<S.cart[k];j++)items.push(+k);
 const p=S.ph.replace(/\D/g,"").replace(/^(91|0)(?=\d{10}$)/,"");
 if(!/^[6-9]\d{9}$/.test(p)){toast("Please enter a valid 10-digit mobile number");return 1}
 const nm=S.nm.trim();let c=S.cust.find(x=>x.p==p);
 if(!c){c={n:nm||"Guest "+p.slice(-4),p,v:0,d:0,s:0,f:items[0]};S.cust.push(c)}else if(nm&&/^Guest /.test(c.n))c.n=nm;
 c.v++;seen(c);S.act=S.cust.indexOf(c);
 const a=items.reduce((s,x)=>s+MENU[x][1],0);S.orders.push({t:S.tb,i:items,a});
 S.done=`✅ <b>Order #${S.orders.length} placed</b> for Table ${S.tb}, ${R(a)}<br><span class="m">Thank you, ${E(first(c))}! Your number is saved for your stamp card and offers.</span>`;
 S.cart={};S.ph="";S.nm="";scrollTo(0,0);
}
const A={
 p:i=>{S.cart[i]=(S.cart[i]||0)+1;S.done=""},
 m:i=>{if(--S.cart[i]<1)delete S.cart[i]},
 place,
 cart:()=>{$("#cart").scrollIntoView({behavior:"smooth"});return 1},
 st:i=>{const c=S.cust[i];S.act=i;seen(c);
  if(c.s>=4){c.s=0;toast(`Free coffee redeemed for ${first(c)}. Card reset.`)}
  else{c.s++;toast(c.s>=4?`${first(c)} unlocked a free coffee 🎁`:`Stamp added for ${first(c)} (${c.s} of 4)`)}},
 send:()=>{const L=S.cust.filter(c=>c.d>=21&&!c.o);L.forEach(c=>c.o=1);S.sent+=L.length;toast(`WhatsApp offer sent to ${L.length} customer${L.length>1?"s":""}`)},
 reset:()=>{S=seed();toast("Sample data restored")}
};
function go(){$("#v").innerHTML=V[S.tab]();document.querySelectorAll("nav button").forEach((b,i)=>{b.classList.toggle("on",i==S.tab);b.setAttribute("aria-current",i==S.tab?"page":"false")});save()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-t]");if(!b)return;const d=b.dataset;
 if(d.t!=null){S.tab=+d.t;go();scrollTo(0,0);return}
 if(A[d.a](+d.i)!==1)go()});
document.addEventListener("input",e=>{if(e.target.id=="ph")S.ph=e.target.value;if(e.target.id=="nm")S.nm=e.target.value});
document.addEventListener("change",e=>{if(e.target.id=="tb"){S.tb=+e.target.value;save()}if(e.target.id=="rc"){S.act=+e.target.value;go()}});
go();
</script>
</body>
</html>
